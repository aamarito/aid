<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>aamaritoaid</title>
  <meta name="description" content="aamaritoaid — your team's workspace for expenses, tasks, products and people.">
  <meta name="theme-color" content="#0D2826">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Hind+Siliguri:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var t=localStorage.getItem("aa-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2"/><path d="M3 10h18"/><path d="M6 6V4.5h11V6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c2 .6 3.2 2.4 3.5 5.2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7L10.2 17a1.7 1.7 0 0 1-2.4-2.4L15.5 7"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="m10 16-4-4 4-4"/><path d="M6 12h10"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
  </svg>

  <!-- Signed-out, pending and setup screens render here -->
  <div id="gate" hidden></div>

  <div class="app" id="app" hidden>
    <aside class="side" aria-label="Main">
      <div class="brand"><div class="mark" aria-hidden="true">a</div><div><b>aamaritoaid</b><small id="coName">Workspace</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="me" id="meBox" type="button" data-act="account"></button>
        <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">Connecting…</span></div>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <div style="min-width:0"><span class="crumb" id="crumb">aamaritoaid</span><h1 id="pageTitle">Overview</h1></div>
        <div class="grow"></div>
        <button class="searchbtn" id="openSearch" type="button" aria-label="Search everything"><svg class="icon"><use href="#i-search"/></svg><span class="lbl">Search everything</span><kbd>Ctrl K</kbd></button>
        <div class="rel">
          <button class="btn pri" id="newBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-plus"/></svg><span class="hide-m">New</span></button>
          <div class="menu" id="newMenu" role="menu" hidden></div>
        </div>
        <button class="btn ghost" id="themeBtn" type="button" aria-label="Switch light or dark"><svg class="icon"><use href="#i-moon"/></svg></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bnav" id="bnav" aria-label="Sections" hidden></nav>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle"></aside>
  <div class="modal" id="palette" role="dialog" aria-label="Search everything">
    <div class="q"><svg class="icon"><use href="#i-search"/></svg><input id="pq" placeholder="Search expenses, tasks, products, people…" autocomplete="off"><button class="btn ghost sm" data-act="closePalette" aria-label="Close search"><svg class="icon"><use href="#i-x"/></svg></button></div>
    <div class="res" id="pres"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">aamaritoaid needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
